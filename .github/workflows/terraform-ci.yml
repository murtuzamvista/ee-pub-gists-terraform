name: Terraform CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run lint and formatting hooks
        run: pre-commit run --all-files

      - name: Validate every configured project and environment
        shell: bash
        run: |
          set -euo pipefail
          while read -r project environment; do
            python scripts/tf.py \
              --operation validate \
              --project "$project" \
              --env "$environment"
          done <<'EOF'
          infra local
          infra nonprod
          infra production
          apps dev
          apps qa
          apps prod
          EOF
